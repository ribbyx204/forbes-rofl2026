<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forbes: Special Edition 2026</title>
    <style>
        :root {
            --forbes-blue: #1c4f82;
            --bg-gray: #f8f8f8;
            --border-color: #e0e0e0;
        }

        body {
            font-family: 'Georgia', serif;
            background-color: var(--bg-gray);
            margin: 0;
            padding: 0;
            color: #111;
        }

        /* Навигация */
        nav {
            background: #fff;
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            justify-content: center;
        }

        nav button {
            background: none;
            border: none;
            padding: 15px 20px;
            font-family: 'Georgia', serif;
            font-size: 1rem;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #666;
        }

        nav button.active {
            color: var(--forbes-blue);
            border-bottom: 2px solid var(--forbes-blue);
            font-weight: bold;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            min-height: 100vh;
            padding: 20px;
            box-sizing: border-box;
        }

        h1 {
            text-align: center;
            font-size: clamp(1.8rem, 5vw, 2.8rem);
            border-bottom: 4px solid black;
            padding-bottom: 10px;
            margin: 20px 0 5px;
            text-transform: uppercase;
        }

        .date-update {
            text-align: center;
            color: #666;
            font-size: 0.8rem;
            margin-bottom: 30px;
            text-transform: uppercase;
        }

        /* Стили списка */
        .list-header {
            display: grid;
            grid-template-columns: 50px 1fr 100px;
            padding: 10px 15px;
            font-weight: bold;
            border-bottom: 2px solid black;
            font-size: 0.9rem;
            text-transform: uppercase;
        }

        .milliardaire-item {
            display: grid;
            grid-template-columns: 50px 1fr 100px;
            align-items: center;
            padding: 15px;
            border-bottom: 1px solid var(--border-color);
            cursor: pointer;
            transition: 0.2s;
        }

        .milliardaire-item:hover { background-color: #f0f7ff; }

        .rank { font-weight: bold; color: var(--forbes-blue); font-size: 1.2rem; }
        .name { font-weight: bold; }
        .net-worth { text-align: right; font-weight: bold; }

        /* Секции */
        .page { display: none; }
        .page.active { display: block; }

        /* Статьи */
        .article-card {
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
        }
        .article-card h3 { color: var(--forbes-blue); margin-bottom: 5px; }
        .article-card p { line-height: 1.6; color: #444; }

        /* Карточка миллиардера (Модалка) */
        #modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); justify-content: center; align-items: center; z-index: 1000;
        }

        .card {
            background: white; width: 95%; max-width: 450px; max-height: 90vh;
            overflow-y: auto; position: relative; border-top: 8px solid var(--forbes-blue);
        }

        .card-img { width: 100%; height: 250px; object-fit: cover; background: #eee; }
        .card-content { padding: 20px; }
        .card-content h2 { margin: 0 0 15px; font-size: 1.8rem; border-bottom: 2px solid black; }
        .card-content p { margin: 10px 0; border-bottom: 1px dashed #eee; padding-bottom: 5px; display: flex; justify-content: space-between; }
        .card-content b { color: var(--forbes-blue); }

        .close-btn { position: absolute; top: 10px; right: 15px; font-size: 30px; cursor: pointer; color: #fff; text-shadow: 0 0 5px #000; z-index: 10; }

        /* МОБИЛЬНАЯ ОПТИМИЗАЦИЯ */
        @media (max-width: 600px) {
            .container { padding: 10px; }
            .milliardaire-item { font-size: 0.9rem; padding: 12px 5px; }
            .card-img { height: 200px; }
        }
    </style>
</head>
<body>

<nav>
    <button id="btn-list" class="active" onclick="switchPage('list')">Список</button>
    <button id="btn-articles" onclick="switchPage('articles')">Энциклопедия</button>
</nav>

<div class="container">
    <div id="page-list" class="page active">
        <h1>Billionaires 2026</h1>
        <div class="date-update">Updated: 13 March 2026</div>
        
        <div class="list-header">
            <div>№</div><div>Имя</div><div>Состояние</div>
        </div>
        <div id="milliardaire-list"></div>
    </div>

    <div id="page-articles" class="page">
        <h1>Энциклопедия</h1>
        <div class="date-update">Определения и факты</div>
        <div id="articles-container"></div>
    </div>
</div>

<div id="modal" onclick="closeCard()">
    <div class="card" onclick="event.stopPropagation()">
        <span class="close-btn" onclick="closeCard()">&times;</span>
        <img id="card-photo" src="" alt="Photo" class="card-img">
        <div class="card-content">
            <h2 id="card-name"></h2>
            <p><b>Возраст</b> <span id="card-age"></span></p>
            <p><b>Состояние</b> <span id="card-wealth"></span></p>
            <p><b>Источник</b> <span id="card-source"></span></p>
            <p><b>Страна</b> <span id="card-country"></span></p>
        </div>
    </div>
</div>

<script>
    // 1. ДАННЫЕ МИЛЛИАРДЕРОВ
    const billionaires = [
        { name: "Klimenkov Maxim", age: "21", wealth: "$4.0 Quadrillion", source: "Tiffany & Co., Google, Torrent, Lucky Blocks, MTS, Playerok, Brainrots", country: "Belarus", img: "Maxim.jpg" },
        { name: "Chiz Artem", age: "21", wealth: "$3.8 Quadrillion", source: "Google, Gemini, Torrent, Lucky Blocks, Standoff 3, FunPay, Brainrots", country: "Belarus", img: "Artem.jpg" },
        { name: "Christiano Ronaldo", age: "41", wealth: "$2.0 Trillion", source: "Sport", country: "Portugal", img: "Cristiano_Ronaldo.webp" },
        { name: "Elon Musk", age: "54", wealth: "$840 Billion", source: "xAI, Tesla, SpaceX", country: "USA", img: "Elon.webp" },
        { name: "Jeff Bezos", age: "62", wealth: "$230 Billion", source: "Amazon", country: "USA", img: "Jeff.webp" }
    ];

    // 2. ДАННЫЕ СТАТЕЙ (КОМПАНИИ И ЛЮДИ)
    const articles = [
        { title: "Tiffany & Co.", text: "Транснациональная корпорация, специализирующаяся на производстве специального материала Тиффани. Основана Даниленко Дарьей в 2025 году." },
        { title: "Torrent", text: "Специальная компьютерная утилита, использующая P2P-соединение для передачи данных. Технология придумана Чижом Артёмом, реализована им же и Клименковым Максимом в 2025 году." },
        { title: "Lucky Blocks & Brainrots", text: "Игра и одновременно торговая площадка, синхронизованная с Playerok и FunPay. Крайне увлекательна, вся молодёжь играет в неё. Разработана Клименковым Максимом и Чижом Артёмом в 2024 году." }
    ];

    // Отрисовка списка
    const listDiv = document.getElementById('milliardaire-list');
    billionaires.forEach((p, i) => {
        listDiv.innerHTML += `
            <div class="milliardaire-item" onclick="showCard(${i})">
                <div class="rank">#${i+1}</div>
                <div class="name">${p.name}</div>
                <div class="net-worth">${p.wealth}</div>
            </div>
        `;
    });

    // Отрисовка статей
    const articlesDiv = document.getElementById('articles-container');
    articles.forEach(art => {
        articlesDiv.innerHTML += `
            <div class="article-card">
                <h3>${art.title}</h3>
                <p>${art.text}</p>
            </div>
        `;
    });

    // Функции управления интерфейсом
    function switchPage(page) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
        
        document.getElementById('page-' + page).classList.add('active');
        document.getElementById('btn-' + page).classList.add('active');
    }

    function showCard(index) {
        const p = billionaires[index];
        document.getElementById('card-name').innerText = p.name;
        document.getElementById('card-age').innerText = p.age;
        document.getElementById('card-wealth').innerText = p.wealth;
        document.getElementById('card-source').innerText = p.source;
        document.getElementById('card-country').innerText = p.country;
        document.getElementById('card-photo').src = p.img;
        document.getElementById('modal').style.display = 'flex';
    }

    function closeCard() { document.getElementById('modal').style.display = 'none'; }
</script>

</body>
</html>
