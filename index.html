<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forbes Archive 2026</title>
    <style>
        :root {
            --forbes-blue: #1c4f82;
            --bg-gray: #f4f4f4;
            --border: #ddd;
        }

        body {
            font-family: 'Georgia', serif;
            background-color: var(--bg-gray);
            margin: 0; padding: 0; color: #111;
            overflow-x: hidden;
        }

        /* Навигация */
        nav.main-nav {
            background: #000;
            display: flex;
            justify-content: center;
            position: sticky; top: 0; z-index: 1000;
        }

        nav.main-nav button {
            background: none; border: none; color: #fff;
            padding: 15px 25px; cursor: pointer;
            text-transform: uppercase; font-size: 0.8rem; letter-spacing: 1px;
            transition: 0.3s;
        }

        nav.main-nav button.active { background: var(--forbes-blue); }

        .container {
            max-width: 800px; margin: 0 auto;
            background: #fff; min-height: 100vh;
            padding: 20px; box-sizing: border-box;
        }

        h1 { text-align: center; text-transform: uppercase; border-bottom: 4px solid #000; padding-bottom: 10px; font-size: 2rem; }
        .date { text-align: center; font-size: 0.8rem; color: #666; margin-bottom: 30px; }

        /* Элементы списка */
        .item {
            display: flex; justify-content: space-between; align-items: center;
            padding: 15px; border-bottom: 1px solid var(--border);
            cursor: pointer; transition: 0.2s;
        }
        .item:hover { background: #f0f7ff; }
        .item b { color: var(--forbes-blue); }

        /* Вкладки Энциклопедии */
        .sub-nav {
            display: flex; gap: 10px; margin-bottom: 20px;
            border-bottom: 1px solid #000; padding-bottom: 10px;
        }
        .sub-nav button {
            border: 1px solid #000; background: #fff;
            padding: 8px 15px; cursor: pointer; font-family: 'Georgia', serif;
            flex: 1;
        }
        .sub-nav button.active { background: #000; color: #fff; }

        /* --- АНИМАЦИИ МОДАЛЬНОГО ОКНА --- */
        #modal {
            display: none; position: fixed; top: 0; left: 0;
            width: 100%; height: 100%; 
            background: rgba(0,0,0,0); /* Начало: прозрачно */
            justify-content: center; align-items: center; z-index: 2000;
            transition: background 0.4s ease;
            visibility: hidden;
        }

        #modal.active {
            background: rgba(0,0,0,0.9);
            visibility: visible;
        }

        .card {
            background: #fff; width: 95%; max-width: 500px;
            max-height: 90vh; overflow-y: auto; position: relative;
            /* Анимация: сдвиг вниз и прозрачность */
            transform: translateY(40px);
            opacity: 0;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.4s ease;
        }

        #modal.active .card {
            transform: translateY(0);
            opacity: 1;
        }

        /* Фото: Большое и красивое */
        .card-img {
            width: 100%; height: 450px; 
            object-fit: cover; 
            display: block;
            background: #eee;
        }

        .card-content { padding: 30px; }
        .card-content h2 { margin: 0 0 20px; font-size: 2rem; border-bottom: 2px solid #000; }
        .card-content p { margin: 12px 0; border-bottom: 1px dashed #ccc; padding-bottom: 8px; display: flex; justify-content: space-between; }
        .card-content b { color: var(--forbes-blue); }

        .close-btn {
            position: absolute; top: 15px; right: 20px;
            font-size: 35px; cursor: pointer; color: #fff; z-index: 10;
            text-shadow: 0 0 10px #000;
        }

        .page { display: none; }
        .page.active { display: block; }

        /* Мобильная адаптация */
        @media (max-width: 600px) {
            .card-img { height: 350px; }
            .card-content { padding: 20px; }
            h1 { font-size: 1.5rem; }
        }
    </style>
</head>
<body>

<nav class="main-nav">
    <button id="btn-list" class="active" onclick="switchPage('list')">Список Forbes</button>
    <button id="btn-wiki" onclick="switchPage('wiki')">Энциклопедия</button>
</nav>

<div class="container">
    <div id="page-list" class="page active">
        <h1>Billionaires 2026</h1>
        <div class="date">Updated: 13 March, 2026</div>
        <div id="milliardaire-list"></div>
    </div>

    <div id="page-wiki" class="page">
        <h1>Энциклопедия</h1>
        <div class="sub-nav">
            <button id="sub-btn-comp" class="active" onclick="switchSubWiki('comp')">Компании</button>
            <button id="sub-btn-peop" onclick="switchSubWiki('peop')">Люди</button>
        </div>
        <div id="wiki-content"></div>
    </div>
</div>

<div id="modal" onclick="closeCard()">
    <div class="card" onclick="event.stopPropagation()">
        <span class="close-btn" onclick="closeCard()">&times;</span>
        <img id="card-photo" src="" alt="Photo" class="card-img">
        <div class="card-content">
            <h2 id="card-name"></h2>
            <div id="card-details"></div>
        </div>
    </div>
</div>

<script>
    // --- ДАННЫЕ (ЗАПОЛНЯЙ ТУТ) ---
    const billionaires = [
        { name: "Klimenkov Maxim", age: "21", wealth: "$4.0 Quadrillion", source: "Tiffany & Co., Google, Torrent, Lucky Blocks, MTS, Playerok, Brainrots", country: "Belarus", img: "Maxim.jpg" },
        { name: "Chiz Artem", age: "21", wealth: "$3.8 Quadrillion", source: "Google, Gemini, Torrent, Lucky Blocks, Standoff 3, FunPay, Brainrots", country: "Belarus", img: "Artem.jpg" },
        { name: "Christiano Ronaldo", age: "41", wealth: "$2.0 Trillion", source: "Sport", country: "Portugal", img: "Cristiano_Ronaldo.webp" },
        { name: "Elon Musk", age: "54", wealth: "$840 Billion", source: "xAI, Tesla, SpaceX", country: "USA", img: "Elon.webp" },
        { name: "Jeff Bezos", age: "62", wealth: "$230 Billion", source: "Amazon", country: "USA", img: "Jeff.webp" }
    ];

    const wikiData = {
        comp: [
            { title: "Tiffany & Co.", text: "Транснациональная корпорация, специализирующаяся на производстве специального материала Тиффани. Основана Даниленко Дарьей в 2025 году." },
        { title: "Torrent", text: "Специальная компьютерная утилита, использующая P2P-соединение для передачи данных. Технология придумана Чижом Артёмом, реализована им же и Клименковым Максимом в 2025 году." },
        { title: "Lucky Blocks & Brainrots", text: "Игра и одновременно торговая площадка, синхронизованная с Playerok и FunPay. Крайне увлекательна, вся молодёжь играет в неё. Разработана Клименковым Максимом и Чижом Артёмом в 2024 году." }
        ],
        peop: [
            { title: "Максим Клименков", text: "Всемирный квадриллионер, с оценкой состояния в 4.0 квадриллиона долларов. Является гендиректором и главным акционером таких компаний, как Tiffany & Co., MTS, Playerok. Многие бизнесы ведёт вместе с деловыи партнёром Чижом Артёмом." },
            { title: "Чиж Артём", text: "Квадриллионер с оценкой состояния в 3.8 квадриллиона долларов, занявший 2 место в списке Forbes. Является основателем торрента, владельцем Gemini, Standoff 3, FunPay. Открыл множество бизнесов вместе с квадриллионером Клименковым Максимом." }
        ]
    };

    // --- ЛОГИКА САЙТА ---

    function renderList() {
        const listDiv = document.getElementById('milliardaire-list');
        listDiv.innerHTML = billionaires.map((p, i) => `
            <div class="item" onclick="showPersonCard(${i})">
                <span><b>#${i+1}</b> ${p.name}</span>
                <span>${p.wealth}</span>
            </div>
        `).join('');
    }

    function renderWiki(type) {
        const wikiDiv = document.getElementById('wiki-content');
        wikiDiv.innerHTML = wikiData[type].map((item, i) => `
            <div class="item" onclick="showWikiCard('${type}', ${i})">
                <span>${item.title}</span>
                <b>➔</b>
            </div>
        `).join('');
    }

    function switchPage(pageId) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('.main-nav button').forEach(b => b.classList.remove('active'));
        document.getElementById('page-' + pageId).classList.add('active');
        document.getElementById('btn-' + pageId).classList.add('active');
        if(pageId === 'wiki') renderWiki('comp');
    }

    function switchSubWiki(type) {
        document.querySelectorAll('.sub-nav button').forEach(b => b.classList.remove('active'));
        document.getElementById('sub-btn-' + type).classList.add('active');
        renderWiki(type);
    }

    // Анимированное открытие
    function openModal() {
        const m = document.getElementById('modal');
        m.style.display = 'flex';
        setTimeout(() => m.classList.add('active'), 10);
    }

    function showPersonCard(i) {
        const p = billionaires[i];
        const photo = document.getElementById('card-photo');
        photo.style.display = 'block';
        photo.src = p.img;
        document.getElementById('card-name').innerText = p.name;
        document.getElementById('card-details').innerHTML = `
            <p><b>Возраст</b> <span>${p.age}</span></p>
            <p><b>Состояние</b> <span>${p.wealth}</span></p>
            <p><b>Источник</b> <span>${p.source}</span></p>
            <p><b>Страна</b> <span>${p.country}</span></p>
        `;
        openModal();
    }

    function showWikiCard(type, i) {
        const art = wikiData[type][i];
        document.getElementById('card-photo').style.display = 'none';
        document.getElementById('card-name').innerText = art.title;
        document.getElementById('card-details').innerHTML = `<p style="border:none; line-height:1.6; display:block">${art.text}</p>`;
        openModal();
    }

    function closeCard() {
        const m = document.getElementById('modal');
        m.classList.remove('active');
        setTimeout(() => m.style.display = 'none', 400);
    }

    // Старт
    renderList();
</script>

</body>
</html>
