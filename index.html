<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forbes: Billionaires 2026</title>
    <style>
        :root { --forbes-blue: #1c4f82; --bg-gray: #f4f4f4; }
        body { font-family: 'Georgia', serif; background-color: var(--bg-gray); margin: 0; padding: 20px; }
        
        .container { max-width: 900px; margin: 0 auto; background: white; padding: 40px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h1 { text-align: center; font-size: 2.5rem; border-bottom: 5px solid black; padding-bottom: 10px; margin-bottom: 5px; text-transform: uppercase; }
        .date-update { text-align: center; color: #666; font-size: 0.9rem; margin-bottom: 40px; text-transform: uppercase; }

        .milliardaire-item { 
            display: grid; grid-template-columns: 60px 1fr 150px; 
            align-items: center; padding: 15px; border-bottom: 1px solid #eee; 
            cursor: pointer; transition: 0.2s; 
        }
        .milliardaire-item:hover { background-color: #f9f9f9; transform: scale(1.01); }
        .rank { font-size: 1.2rem; font-weight: bold; color: var(--forbes-blue); }
        .name { font-size: 1.1rem; font-weight: bold; }
        .net-worth { text-align: right; font-weight: bold; color: #111; }

        /* Карточка */
        #modal { 
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0,0,0,0.85); justify-content: center; align-items: center; z-index: 1000; 
        }
        .card { 
            background: white; width: 90%; max-width: 450px; position: relative; 
            border-top: 8px solid var(--forbes-blue); text-align: center; padding-bottom: 30px;
        }
        .close-btn { position: absolute; top: 10px; right: 20px; font-size: 35px; cursor: pointer; color: #999; }
        
        /* Стили для фото в карточке */
        .card-img {
            width: 100%; height: 300px; object-fit: cover; background: #eee;
            margin-bottom: 20px; border-bottom: 1px solid #ddd;
        }
        .card-info { padding: 0 30px; text-align: left; }
        .card-info h2 { margin: 0 0 15px 0; font-size: 1.8rem; border-bottom: 2px solid black; padding-bottom: 5px; }
        .card-info p { margin: 8px 0; border-bottom: 1px dashed #eee; padding-bottom: 5px; }
        .card-info b { color: var(--forbes-blue); width: 100px; display: inline-block; }
    </style>
</head>
<body>

<div class="container">
    <h1>The World's Billionaires</h1>
    <div class="date-update">Updated: March 13, 2026</div>
    
    <div id="list">
        </div>
</div>

<div id="modal" onclick="closeCard()">
    <div class="card" onclick="event.stopPropagation()">
        <span class="close-btn" onclick="closeCard()">&times;</span>
        <img id="card-photo" src="" alt="Photo" class="card-img">
        <div class="card-info">
            <h2 id="card-name">Имя</h2>
            <p><b>Возраст:</b> <span id="card-age"></span></p>
            <p><b>Состояние:</b> <span id="card-wealth"></span></p>
            <p><b>Источник:</b> <span id="card-source"></span></p>
            <p><b>Страна:</b> <span id="card-country"></span></p>
        </div>
    </div>
</div>

<script>
    // ДАННЫЕ МИЛЛИАРДЕРОВ
    const billionaires = [
        { 
            name: "Klimenkov Maxim", 
            age: "21", 
            wealth: "$4.0 Quadrillion", 
            source: "Tiffany & Co., Google, Torrent, Lucky Blocks, MTS, Playerok, Brainrots", 
            country: "Belarus",
            img: "Maxim.jpg" // Замени на свою ссылку или имя файла
        },
        { 
            name: "Chiz Artem", age: "21", wealth: "$3.8 Quadrillion", source: "Google, Gemini, Torrent, Lucky Blocks, Standoff 3, FunPay, Brainrots", country: "Belarus",
            img: "Artem.jpg" 
        },
        { 
            name: "Christiano Ronaldo", age: "41", wealth: "$2.0 Trillion", source: "Sport & Investments", country: "Portugal",
            img: "Cristiano_Ronaldo.webp"
        },
        { 
            name: "Elon Musk", age: "54", wealth: "$840 Billion", source: "SpaceX, Tesla, xAI", country: "USA",
            img: "Elon.webp"
        },
        { 
            name: "Jeff Bezos", age: "62", wealth: "$230 Billion", source: "Amazon", country: "USA",
            img: "Jeff.webp"
        }
    ];

    const listContainer = document.getElementById('list');

    // Отрисовка списка
    billionaires.forEach((person, index) => {
        listContainer.innerHTML += `
            <div class="milliardaire-item" onclick="showCard(${index})">
                <div class="rank">#${index + 1}</div>
                <div class="name">${person.name}</div>
                <div class="net-worth">${person.wealth.split(' ')[0]} ${person.wealth.split(' ')[1][0]}</div>
            </div>
        `;
    });

    function showCard(index) {
        const p = billionaires[index];
        document.getElementById('card-name').innerText = p.name;
        document.getElementById('card-age').innerText = p.age;
        document.getElementById('card-wealth').innerText = p.wealth;
        document.getElementById('card-source').innerText = p.source;
        document.getElementById('card-country').innerText = p.country;
        document.getElementById('card-photo').src = p.img;
        document.getElementById('modal').style.display = 'flex';
    }

    function closeCard() {
        document.getElementById('modal').style.display = 'none';
    }
</script>

</body>
</html>
